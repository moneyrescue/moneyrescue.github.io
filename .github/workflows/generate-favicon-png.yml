name: Generate favicon.png from favicon.svg

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cairosvg
        run: pip install cairosvg

      - name: Render 192x192 favicon.png from favicon.svg
        run: python -c "import cairosvg; cairosvg.svg2png(url='favicon.svg', write_to='favicon.png', output_width=192, output_height=192)"

      - name: Verify PNG dimensions
        run: python -c "from PIL import Image; im=Image.open('favicon.png'); print('favicon.png size:', im.size); assert im.size == (192, 192), im.size"

      - name: Commit favicon.png
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add favicon.png
          git diff --cached --quiet && echo "no changes to commit" || git commit -m "Add 192x192 favicon.png generated from favicon.svg"
          git push
