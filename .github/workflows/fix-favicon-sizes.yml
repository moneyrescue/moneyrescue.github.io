name: Fix favicon sizes attribute in index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Update sizes attribute to match 192x192 favicon.png
        run: |
          echo "--- before ---"
          grep -n 'favicon.png' index.html
          sed -i 's|<link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">|<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">|' index.html
          echo "--- after ---"
          grep -n 'favicon.png' index.html

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes to commit" || git commit -m "Fix favicon.png sizes attribute 32x32 -> 192x192 to match actual file"
          git push
